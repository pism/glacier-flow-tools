name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'
  # Run by hand (Actions -> Publish to PyPI -> Run workflow) and enter a tag, for
  # example v0.2.0, to publish a version whose tag-triggered run failed.
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build and publish, for example v0.2.0
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    # PyPI trusted publishing: no token is stored, PyPI trusts this workflow
    # in this repository and environment. Configure it at
    # https://pypi.org/manage/project/glacier-flow-tools/settings/publishing/
    environment:
      name: pypi
      url: https://pypi.org/project/glacier-flow-tools/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0  # setuptools_scm needs the tags

      - uses: actions/setup-python@v7
        with:
          python-version: 3.x

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          # Not `python -m build`: it would import ./build.py instead of the build package.
          pyproject-build
          twine check --strict dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
